name: Bitbucketdashboard CI CD  # Keep only one `name:`

on: [push]  # This triggers the workflow on every push

env:
  AZURE_WEBAPP_NAME: Bitbucketdashboard  # Set this to your Azure App Name
  AZURE_WEBAPP_PACKAGE_PATH: '.'  # Set this to the correct path (e.g., 'build' for React)
  NODE_VERSION: '20.x'  # Set this to the Node.js version you need

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4  # Use the latest stable version

      # Azure login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Setup Node.js
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Install dependencies, build, and test
      - name: Install Dependencies, Build, and Test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present
        working-directory: .

      # Deploy to Azure
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./build  # Ensure this matches your build folder

      # Azure Logout
      - name: Logout from Azure
        run: az logout
