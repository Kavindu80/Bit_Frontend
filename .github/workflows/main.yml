name: Bitbucketdashboard CI CD  # Keep only one `name:`

on: [push]  # This triggers the workflow on every push

env:
  AZURE_WEBAPP_NAME: Bitbucketdashboard  # Set this to your Azure App Name
  AZURE_WEBAPP_PACKAGE_PATH: './build'  # Ensure this is the correct build output path
  NODE_VERSION: '20.x'  # Set this to the Node.js version you need

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4  # Use the latest stable version

      # Azure login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.BITBUCKETDASHBOARD }}

      # Setup Node.js with caching for faster installs
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Install dependencies, clean, build, and test
      - name: Install Dependencies, Build, and Test
        run: |
          rm -rf node_modules package-lock.json  # Remove existing modules to prevent conflicts
          npm install
          export NODE_OPTIONS="--max-old-space-size=4096"  # Prevent memory issues
          npm run build --if-present
          npm run test --if-present
        working-directory: .

      # Ensure the build folder exists before deployment
      - name: Verify Build Output
        run: ls -la ./build

      # Deploy to Azure
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      # Azure Logout
      - name: Logout from Azure
        run: az logout
